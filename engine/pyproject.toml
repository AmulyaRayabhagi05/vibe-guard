[project]
name = "vibecheck-engine"
version = "0.1.0"
description = "Local security + accessibility scanner and fixer for AI-generated apps"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  # Use the OS certificate store for HTTPS (Windows/macOS Pythons often lack one).
  "truststore>=0.9",
]

[project.optional-dependencies]
# AI observability: local MLflow server with built-in token + cost tracking (>=3.10)
observability = ["mlflow[genai]>=3.10"]
# Live-site WCAG checks with axe-core in headless Chromium
a11y = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
vibecheck-engine = "vibecheck_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibecheck_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
