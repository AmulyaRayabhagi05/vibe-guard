# VibeCheck app-security rules for Python (FastAPI, Flask, Django, scripts).
rules:
  - id: vc-app-py-sql-injection
    languages: [python]
    severity: ERROR
    message: >-
      A SQL query is built with an f-string, % or + so user input can change the query. Pass values
      as parameters: cursor.execute("... WHERE id = %s", (id,)).
    metadata:
      title: SQL injection through string building
      category: app
      severity: high
      cwe: "CWE-89"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern-either:
          - pattern: $C.execute(f"...", ...)
          - pattern: $C.execute("..." % $X, ...)
          - pattern: $C.execute("...".format(...), ...)
          - pattern: $C.execute("..." + $X, ...)
          - pattern: $C.executescript(f"...", ...)
          - pattern: text(f"...")
          - pattern: $C.raw(f"...", ...)
      - pattern-not: $C.execute(f"{$X}", ...)

  - id: vc-app-py-command-injection
    languages: [python]
    severity: ERROR
    message: >-
      A shell command is built from a variable with shell=True or os.system, so user input can run
      commands on the server. Pass a list of arguments with shell=False.
    metadata:
      title: Command injection
      category: app
      severity: critical
      cwe: "CWE-78"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern-either:
          - pattern: subprocess.$F($CMD, ..., shell=True, ...)
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
      - pattern-not: subprocess.$F("...", ..., shell=True, ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...", ...)

  - id: vc-app-py-eval
    languages: [python]
    severity: ERROR
    message: >-
      eval()/exec() runs any string as Python. If any part comes from a user or a model, an
      attacker can take over the server. Use json.loads or ast.literal_eval for data.
    metadata:
      title: Dynamic code execution with eval/exec
      category: app
      severity: high
      cwe: "CWE-95"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)

  - id: vc-app-py-debug-on
    languages: [python]
    severity: WARNING
    message: >-
      Debug mode is on. Flask's debugger lets anyone run code from the browser, and Django's shows
      settings and secrets on error pages. Read it from an env var and keep it off in production.
    metadata:
      title: Debug mode enabled
      category: app
      severity: high
      cwe: "CWE-489"
      owasp: "A05:2021 Security Misconfiguration"
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - patterns:
          - pattern: DEBUG = True
          - pattern-inside: |
              SECRET_KEY = ...
              ...

  - id: vc-app-py-hardcoded-secret-key
    languages: [python]
    severity: ERROR
    message: >-
      The app's secret key is hardcoded, so anyone with the code can forge sessions or tokens.
      Load it from an environment variable.
    metadata:
      title: Hardcoded secret key
      category: secret
      severity: critical
      cwe: "CWE-798"
      owasp: "A07:2021 Identification and Authentication Failures"
    pattern-either:
      - pattern: $APP.secret_key = "..."
      - pattern: $APP.config["SECRET_KEY"] = "..."
      - pattern: SECRET_KEY = "..."
      - pattern: jwt.encode($P, "...", ...)
      - pattern: jwt.decode($T, "...", ...)

  - id: vc-app-py-jwt-no-verify
    languages: [python]
    severity: ERROR
    message: >-
      The JWT signature is not checked, so a forged token is accepted. Remove
      verify_signature False and pass the key and algorithms.
    metadata:
      title: JWT decoded without verifying the signature
      category: app
      severity: high
      cwe: "CWE-347"
      owasp: "A07:2021 Identification and Authentication Failures"
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: jwt.decode(..., verify=False, ...)

  - id: vc-app-py-cors-wildcard-credentials
    languages: [python]
    severity: WARNING
    message: >-
      CORS allows any origin together with credentials, so any website can make logged-in requests
      to your API. List your real origins.
    metadata:
      title: CORS allows any origin with credentials
      category: app
      severity: medium
      cwe: "CWE-942"
      owasp: "A05:2021 Security Misconfiguration"
    pattern-either:
      - pattern: '$APP.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ..., allow_credentials=True, ...)'
      - pattern: '$APP.add_middleware(CORSMiddleware, ..., allow_credentials=True, ..., allow_origins=["*"], ...)'
      - pattern: 'CORS($APP, ..., supports_credentials=True, ...)'

  - id: vc-app-py-fastapi-idor
    languages: [python]
    severity: ERROR
    message: >-
      This endpoint takes a record id from the URL but has no auth dependency, so anyone can read
      or change any record. Add a Depends(get_current_user) parameter and check ownership.
    metadata:
      title: Endpoint reads records by id with no auth check
      category: app
      severity: critical
      cwe: "CWE-639"
      owasp: "A01:2021 Broken Access Control"
    patterns:
      - pattern-either:
          - pattern: |
              @$APP.$M($PATH, ...)
              def $F(...): ...
          - pattern: |
              @$APP.$M($PATH, ...)
              async def $F(...): ...
      - metavariable-regex:
          metavariable: $M
          regex: ^(get|put|patch|delete|post)$
      - metavariable-regex:
          metavariable: $PATH
          regex: '.*\{\w*id\}'
      - pattern-not: |
          @$APP.$M($PATH, ..., dependencies=$D, ...)
          def $F(...): ...
      - pattern-not: |
          @$APP.$M($PATH, ..., dependencies=$D, ...)
          async def $F(...): ...
      - pattern-not-regex: Depends\(|Security\(|current_user|login_required

  - id: vc-app-py-flask-idor
    languages: [python]
    severity: ERROR
    message: >-
      This Flask route takes a record id from the URL but never checks who is logged in. Add
      @login_required and check the record belongs to current_user.
    metadata:
      title: Route reads records by id with no auth check
      category: app
      severity: critical
      cwe: "CWE-639"
      owasp: "A01:2021 Broken Access Control"
    patterns:
      - pattern: |
          @$APP.route($PATH, ...)
          def $F(...): ...
      - metavariable-regex:
          metavariable: $PATH
          regex: '.*<(int:|string:)?\w*id>'
      - pattern-not-regex: login_required|current_user|session\[|g\.user|jwt_required

  - id: vc-app-py-path-traversal
    languages: [python]
    severity: ERROR
    message: >-
      A file path comes from the request, so "../" can read any file on the server. Use
      werkzeug's safe_join or check the resolved path stays inside the allowed folder.
    metadata:
      title: Path traversal
      category: app
      severity: high
      cwe: "CWE-22"
      owasp: "A01:2021 Broken Access Control"
    pattern-either:
      - pattern: open(<... request.$A ...>, ...)
      - pattern: send_file(<... request.$A ...>, ...)

  - id: vc-app-py-ssrf
    languages: [python]
    severity: ERROR
    message: >-
      The server fetches a URL chosen by the user, which lets attackers reach internal services
      (SSRF). Allow only known hosts.
    metadata:
      title: Server-side request forgery (SSRF)
      category: app
      severity: high
      cwe: "CWE-918"
      owasp: "A10:2021 Server-Side Request Forgery"
    pattern-either:
      - pattern: requests.$M(<... request.$A ...>, ...)
      - pattern: httpx.$M(<... request.$A ...>, ...)
      - pattern: urllib.request.urlopen(<... request.$A ...>, ...)

  - id: vc-app-py-open-redirect
    languages: [python]
    severity: WARNING
    message: >-
      The redirect target comes from the request, so attackers can bounce users to a phishing site
      through your domain. Only allow relative paths.
    metadata:
      title: Open redirect
      category: app
      severity: medium
      cwe: "CWE-601"
      owasp: "A01:2021 Broken Access Control"
    pattern-either:
      - pattern: redirect(request.args.get(...))
      - pattern: redirect(request.args[...])
      - pattern: RedirectResponse(<... request.query_params ...>, ...)

  - id: vc-app-py-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      pickle and yaml.load can run code while loading data. Use json, or yaml.safe_load.
    metadata:
      title: Unsafe deserialization
      category: app
      severity: high
      cwe: "CWE-502"
      owasp: "A08:2021 Software and Data Integrity Failures"
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: yaml.load($X)
          - pattern: yaml.load($X, Loader=yaml.Loader)
          - pattern: yaml.load($X, Loader=yaml.UnsafeLoader)

  - id: vc-app-py-weak-password-hash
    languages: [python]
    severity: WARNING
    message: >-
      Passwords hashed with MD5/SHA1/SHA256 can be cracked quickly. Use bcrypt, argon2 or
      passlib's CryptContext.
    metadata:
      title: Weak password hashing
      category: app
      severity: high
      cwe: "CWE-916"
      owasp: "A02:2021 Cryptographic Failures"
    patterns:
      - pattern: hashlib.$H(<... $PW ...>, ...)
      - metavariable-regex:
          metavariable: $H
          regex: ^(md5|sha1|sha256|sha512)$
      - metavariable-regex:
          metavariable: $PW
          regex: (?i).*(password|passwd|pwd)

  - id: vc-app-py-tls-verify-off
    languages: [python]
    severity: WARNING
    message: >-
      TLS certificate checks are off, so traffic can be intercepted. Remove verify=False.
    metadata:
      title: TLS certificate verification disabled
      category: app
      severity: medium
      cwe: "CWE-295"
      owasp: "A02:2021 Cryptographic Failures"
    pattern-either:
      - pattern: requests.$M(..., verify=False, ...)
      - pattern: httpx.$M(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)
